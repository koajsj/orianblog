<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="All writing by Orian.">
    <title>Archive | Orian's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="subpage anim-init">
    <nav class="navbar navbar-subpage" aria-label="Main navigation">
        <div class="nav-container">
            <a href="index.html" class="nav-back-btn" aria-label="Return to home">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Back
            </a>
            <a href="index.html" class="logo">
                <i class="fas fa-code" aria-hidden="true"></i>
                Orian's Blog
            </a>
            <div class="nav-actions">
                <ul class="nav-links nav-links-actions">
                    <li>
                        <a href="https://github.com/koajsj/orianblog" class="resume-btn" target="_blank" rel="noopener noreferrer" aria-label="Open the site repository on GitHub">
                            GitHub
                            <i class="fab fa-github" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <section class="page-intro reveal">
            <div class="section-container page-intro-layout">
                <p class="section-kicker section-kicker-strong" data-archive-kicker>Archive</p>
                <h1 class="page-title page-title-xl">Archive</h1>
                <p class="page-copy page-copy-tight">All writing.</p>
            </div>
        </section>

        <section class="articles-section reveal" aria-labelledby="articles-archive-title">
            <div class="section-container">
                <h2 id="articles-archive-title" class="sr-only">Article archive</h2>
                <div class="articles-toolbar">
                    <label class="articles-search articles-search-wide" for="articles-search">
                        <span class="articles-search-icon" aria-hidden="true">
                            <i class="fas fa-search"></i>
                        </span>
                        <input
                            id="articles-search"
                            class="articles-search-input"
                            type="search"
                            name="search"
                            placeholder="Search title, excerpt, or article body"
                            autocomplete="off"
                            spellcheck="false"
                            data-articles-search
                        >
                        <button type="button" class="articles-clear-btn" data-articles-clear hidden>Clear</button>
                    </label>
                    <div class="articles-toolbar-side">
                        <label class="articles-sort" for="articles-sort">
                            <select id="articles-sort" data-articles-sort>
                                <option value="latest">Latest</option>
                                <option value="views">Most viewed</option>
                                <option value="likes">Most liked</option>
                            </select>
                        </label>
                    </div>
                </div>
                <div class="articles-grid" data-articles-list data-articles-view="archive"></div>
            </div>
        </section>
    </main>

    <footer class="footer bg-dark text-white reveal">
        <div class="section-container footer-flex">
            <div class="logo">
                <i class="fas fa-code" aria-hidden="true"></i>
                Orian's Blog
            </div>
        </div>
    </footer>

    <script src="js/articles-data.js" defer></script>
    <script src="js/blog-utils.js" defer></script>
    <script src="js/articles-home.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
