<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="All articles from Orian's Blog.">
    <title>Articles | Orian's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="subpage">
    <nav class="navbar navbar-subpage" aria-label="Main navigation">
        <div class="nav-container">
            <a href="index.html" class="nav-back-btn" aria-label="Return to home">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Back
            </a>
            <a href="index.html" class="logo">
                <i class="fas fa-code" aria-hidden="true"></i> Orian's Blog
            </a>
            <div class="nav-actions">
                <ul class="nav-links nav-links-actions">
                    <li>
                        <a href="https://github.com/koajsj/orianblog" class="resume-btn" target="_blank" rel="noopener noreferrer" aria-label="Open the site repository on GitHub">GitHub <i class="fab fa-github" aria-hidden="true"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <section class="page-intro reveal">
            <div class="section-container page-intro-layout">
                <h1 class="page-title page-title-xl">Articles</h1>
                <p class="page-copy page-copy-tight">All writing in one place.</p>
            </div>
        </section>

        <section class="articles-section reveal" aria-labelledby="articles-archive-title">
            <div class="section-container">
                <h2 id="articles-archive-title" class="sr-only">Article archive</h2>
                <div class="articles-toolbar">
                    <label class="articles-search" for="articles-search">
                        <span class="articles-search-icon" aria-hidden="true">
                            <i class="fas fa-search"></i>
                        </span>
                        <input
                            id="articles-search"
                            class="articles-search-input"
                            type="search"
                            name="search"
                            placeholder="Search articles"
                            autocomplete="off"
                            spellcheck="false"
                            data-articles-search
                        >
                    </label>
                    <p class="articles-search-meta" data-articles-search-status></p>
                </div>
                <div class="articles-grid" data-articles-list data-articles-view="archive"></div>
            </div>
        </section>
    </main>

    <footer class="footer bg-dark text-white reveal">
        <div class="section-container footer-flex">
            <div class="logo"><i class="fas fa-code" aria-hidden="true"></i> Orian's Blog</div>
            <div>
                <p>&copy; 2026 Orian's Blog. All rights reserved.</p>
                <p>Designed by <a href="#">Orian</a></p>
            </div>
        </div>
    </footer>

    <script src="js/articles-data.js" defer></script>
    <script src="js/blog-utils.js" defer></script>
    <script src="js/articles-home.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
