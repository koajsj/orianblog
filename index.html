<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Orian's Blog</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <noscript>
        <style>
            body.anim-init .nav-container .logo,
            body.anim-init .resume-btn,
            body.anim-init .hero-title,
            body.anim-init .hero-desc,
            body.anim-init .social-icons a {
                opacity: 1 !important;
                transform: none !important;
            }
            body.anim-init .hero-title .fw-bold {
                animation: none !important;
                background-size: 100% 2px !important;
            }
            .reveal:not(.reveal-in) {
                opacity: 1 !important;
                transform: none !important;
            }
        </style>
    </noscript>
</head>
<body data-theme="light" class="anim-init">
    <!-- Navigation -->
    <nav class="navbar" aria-label="主导航">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-code" aria-hidden="true"></i> Orian
            </a>
            <ul class="nav-links">
                <li>
                    <button type="button" class="resume-btn">Resume <i class="fas fa-download" aria-hidden="true"></i></button>
                </li>
            </ul>
        </div>
    </nav>

    <main id="main-content">
        <!-- Hero Section -->
        <header class="hero">
            <div class="hero-container">
                <div class="hero-content">
                    <h1 class="hero-title">
                        Hello I'm <span class="fw-bold">Orian.</span>
                    </h1>
                    <p class="hero-desc">
                        I'm Orian.
                    </p>
                    <div class="social-icons">
                        <a href="#" aria-label="Facebook（即将推出）"><i class="fab fa-facebook" aria-hidden="true"></i></a>
                        <a href="#" aria-label="Reddit（即将推出）"><i class="fab fa-reddit" aria-hidden="true"></i></a>
                        <a href="#" aria-label="Twitter / X（即将推出）"><i class="fab fa-twitter" aria-hidden="true"></i></a>
                        <a href="#" aria-label="Discord（即将推出）"><i class="fab fa-discord" aria-hidden="true"></i></a>
                    </div>
                </div>
            </div>
        </header>
    </main>

    <!-- Footer -->
    <footer class="footer bg-dark text-white reveal">
        <div class="section-container footer-flex">
            <div class="logo"><i class="fas fa-code" aria-hidden="true"></i> Orian</div>
            <div>
                <p>&copy; 2026 Orian's Blog. All rights reserved.
                </p>
                <p>Designed by <a href="#">Orian</a></p>
            </div>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
</body>
</html>
