<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Orian's personal blog for motion notes and frontend writing.">
    <title>Orian's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <noscript>
        <style>
            body.anim-init .nav-container .logo,
            body.anim-init .resume-btn,
            body.anim-init .hero-title,
            body.anim-init .hero-line-inner,
            body.anim-init .social-icons a {
                opacity: 1 !important;
                transform: none !important;
            }
            body.anim-init .hero-title .fw-bold {
                animation: none !important;
                background-size: 100% 2px !important;
            }
            .reveal:not(.reveal-in) {
                opacity: 1 !important;
                transform: none !important;
            }
        </style>
    </noscript>
</head>
<body class="anim-init">
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-code" aria-hidden="true"></i> Orian's Blog
            </a>
            <ul class="nav-links">
                <li>
                    <a href="articles.html">Articles</a>
                </li>
            </ul>
            <div class="nav-actions">
                <ul class="nav-links nav-links-actions">
                <li>
                    <a href="https://github.com/koajsj/orianblog" class="resume-btn" target="_blank" rel="noopener noreferrer" aria-label="Open the site repository on GitHub">GitHub <i class="fab fa-github" aria-hidden="true"></i></a>
                </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <header class="hero">
            <div class="hero-container">
                <div class="hero-content">
                    <h1 class="hero-title" aria-label="Hello I'm Orian.">
                        <span class="hero-line">
                            <span class="hero-line-inner">Hello</span>
                        </span>
                        <span class="hero-line">
                            <span class="hero-line-inner">I'm <span class="fw-bold">Orian.</span></span>
                        </span>
                    </h1>
                    <ul class="social-icons">
                        <li>
                            <a href="#" aria-label="Telegram coming soon"><i class="fab fa-telegram" aria-hidden="true"></i></a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <section id="articles" class="articles-section reveal" aria-labelledby="articles-title">
            <div class="section-container">
                <div class="section-heading-row">
                    <div class="section-heading">
                        <p class="section-kicker section-kicker-strong">ARTICLES</p>
                        <h2 id="articles-title" class="section-title">Latest writing.</h2>
                    </div>
                    <div class="articles-home-tools">
                        <label class="articles-sort articles-sort-home" for="home-articles-sort">
                            <select id="home-articles-sort" data-articles-sort>
                                <option value="latest">Latest</option>
                                <option value="views">Most viewed</option>
                                <option value="likes">Most liked</option>
                            </select>
                        </label>
                        <div class="articles-home-search" data-articles-search-shell>
                            <button
                                type="button"
                                class="articles-search-toggle"
                                aria-label="Search recent articles"
                                aria-expanded="false"
                                aria-controls="home-articles-search"
                                data-articles-search-toggle
                            >
                                <i class="fas fa-search" aria-hidden="true"></i>
                            </button>
                            <label class="articles-search articles-search-inline" for="home-articles-search">
                                <span class="articles-search-icon" aria-hidden="true">
                                    <i class="fas fa-search"></i>
                                </span>
                                <input
                                    id="home-articles-search"
                                    class="articles-search-input"
                                    type="search"
                                    name="home-search"
                                    placeholder="Search recent writing"
                                    autocomplete="off"
                                    spellcheck="false"
                                    data-articles-search
                                >
                            </label>
                        </div>
                        <a href="articles.html" class="articles-archive-link">All articles</a>
                    </div>
                </div>
                <div class="articles-grid" data-articles-list data-articles-view="recent"></div>
            </div>
        </section>
    </main>

    <footer class="footer bg-dark text-white reveal">
        <div class="section-container footer-flex">
            <div class="logo"><i class="fas fa-code" aria-hidden="true"></i> Orian's Blog</div>
            <div>
                <p>&copy; 2026 Orian's Blog. All rights reserved.</p>
                <p>Designed by <a href="#">Orian</a></p>
            </div>
        </div>
    </footer>

    <script src="js/articles-data.js" defer></script>
    <script src="js/blog-utils.js" defer></script>
    <script src="js/articles-home.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
