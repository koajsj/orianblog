<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Orian's blog.">
    <title>Orian's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="anim-init home-page">
    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-code" aria-hidden="true"></i>
                Orian's Blog
            </a>
            <ul class="nav-links">
                <li><a href="articles.html">Articles</a></li>
            </ul>
            <div class="nav-actions">
                <ul class="nav-links nav-links-actions">
                    <li>
                        <a href="https://github.com/koajsj/orianblog" class="resume-btn" target="_blank" rel="noopener noreferrer" aria-label="Open the site repository on GitHub">
                            GitHub
                            <i class="fab fa-github" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main id="main-content">
        <header class="hero hero-home">
            <div class="hero-container">
                <div class="hero-content hero-grid">
                    <section class="hero-copy reveal">
                        <h1 class="hero-title" aria-label="I'm Orian.">
                            <span class="hero-line">
                                <span class="hero-line-inner">I'm <span class="fw-bold">Orian.</span></span>
                            </span>
                        </h1>
                        <div class="hero-actions">
                            <a href="articles.html" class="button button-primary" data-primary-cta>Articles</a>
                        </div>
                    </section>
                </div>
            </div>
        </header>

        <section id="articles" class="articles-section reveal" aria-labelledby="articles-title">
            <div class="section-container">
                <div class="section-heading-row">
                    <div class="section-heading">
                        <h2 id="articles-title" class="section-title">Latest</h2>
                    </div>
                    <div class="articles-home-tools">
                        <a href="articles.html" class="articles-archive-link">All</a>
                    </div>
                </div>
                <div class="articles-grid" data-articles-list data-articles-view="recent"></div>
            </div>
        </section>
    </main>

    <footer class="footer bg-dark text-white reveal">
        <div class="section-container footer-flex">
            <div class="logo">
                <i class="fas fa-code" aria-hidden="true"></i>
                Orian's Blog
            </div>
        </div>
    </footer>

    <script src="js/articles-data.js" defer></script>
    <script src="js/blog-utils.js" defer></script>
    <script src="js/articles-home.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
